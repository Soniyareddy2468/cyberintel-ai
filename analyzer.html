<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CyberIntel AI | Email Analyzer</title><link rel="stylesheet" href="css/style.css"></head><body><aside class="sidebar"><div class="brand">🛡️ CyberIntel AI</div><nav><a href="index.html">Dashboard</a><a class="active" href="analyzer.html">Email Analyzer</a><a href="forensics.html">Forensics</a></nav></aside><main class="main"><header><div><p class="eyebrow">AI THREAT ANALYSIS</p><h1>Email Analyzer</h1><p class="muted">Paste a suspicious email below for a safe demo analysis.</p></div></header><section class="card"><div class="form-grid"><label>Sender email<input id="sender" placeholder="sender@example.com"></label><label>Subject<input id="subject" placeholder="Urgent account verification"></label></div><label>Email content<textarea id="emailText" rows="12" placeholder="Paste email body or headers here..."></textarea></label><button class="button" id="analyzeBtn">Analyze Threat</button><div id="loading" class="loading hidden">Analyzing indicators with CyberIntel AI…</div></section><section id="result" class="hidden"><div class="grid four"><div class="card metric"><span>Threat Score</span><strong id="score">0</strong><small>/100</small></div><div class="card metric"><span>Phishing Probability</span><strong id="phishing">0%</strong></div><div class="card metric"><span>URL Risk</span><strong id="urlRisk">0%</strong></div><div class="card metric"><span>Sender Risk</span><strong id="senderRisk">0%</strong></div></div><div class="grid two"><div class="card"><div class="section-head"><h3>Recommendation</h3><span id="riskBadge" class="badge danger">HIGH</span></div><p id="recommendation"></p></div><div class="card"><h3>Indicators of Compromise</h3><div id="iocList" class="ioc-list"></div></div></div></section></main><script src="js/analyzer.js"></script></body></html>
